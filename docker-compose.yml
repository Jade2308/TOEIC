services:
  # Next.js 16 Standalone Web Application (100% Local Filesystem Storage)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: toeic-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - PROCESSED_DATA_DIR=/app/data/exams
      - RAW_DATA_DIR=/app/data/raw
      - MEDIA_DATA_DIR=/app/data/media
      - USER_DATA_DIR=/app/data/user
    volumes:
      - ./data/exams:/app/data/exams:ro
      - ./data/raw:/app/data/raw
      - ./data/media:/app/data/media:ro
      - ./data/user:/app/data/user
    networks:
      - toeic-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # High-performance Nginx Reverse Proxy & Media Server (Offloads Audio & Images)
  nginx:
    image: nginx:alpine
    container_name: toeic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/media:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - toeic-net

networks:
  toeic-net:
    driver: bridge
