server {
    listen 80;
    server_name _;

    # Cho phép upload file đề thi PDF và Audio lớn (lên tới 250MB)
    client_max_body_size 250M;

    # Gzip nén các file text/json để tải trang cực nhanh
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # =========================================================================
    # 1. PHỤC VỤ STATIC MEDIA TRỰC TIẾP (OFFLOAD TOÀN BỘ KHỎI NODE.JS)
    # =========================================================================

    # Audio cắt nhỏ từng câu (Part 1, 2, 3, 4) - Hỗ trợ Range Requests tua thanh audio
    location /audio/ {
        alias /var/www/media/audio/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Hình ảnh đề thi crop & graphics
    location /images/ {
        alias /var/www/media/images/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Next.js Static Chunks (CSS, JS, Fonts)
    location /_next/static/ {
        proxy_pass http://web:3000;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # =========================================================================
    # 2. SERVER-SENT EVENTS (SSE) - LIVE LOG CỦA PIPELINE BÓC TÁCH AI
    # =========================================================================
    location /api/admin/pipeline {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # =========================================================================
    # 3. TOÀN BỘ CÁC ROUTE VÀ API CÒN LẠI CHUYỂN TIẾP CHO NEXT.JS
    # =========================================================================
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
